# 🤖 AI & Large Language Models
- name: Ollama
  url: https://github.com/ollama/ollama
  description: Run large language models locally with ease — like Docker for LLMs.
  license: MIT
  category: AI & LLMs

- name: Whisper
  url: https://github.com/openai/whisper
  description: OpenAI's general-purpose speech recognition model for multilingual transcription.
  license: MIT
  category: AI & LLMs

- name: OpenCode
  # Fixed: previously opencode-org/opencode. anomalyco/opencode is the repo the project's own README points to.
  url: https://github.com/anomalyco/opencode
  description: The most-starred open-source coding agent — a terminal-based AI pair programmer with 75+ model providers.
  license: MIT
  category: AI & LLMs

- name: LangChain
  url: https://github.com/langchain-ai/langchain
  description: The leading framework for building LLM-powered applications with chains, agents, and RAG capabilities.
  license: MIT
  category: AI & LLMs

- name: AutoGPT
  url: https://github.com/Significant-Gravitas/AutoGPT
  description: Autonomous AI agents that break down complex goals into executable tasks without human intervention.
  license: MIT
  category: AI & LLMs

- name: FreeLLMAPI
  url: https://github.com/tashfeenahmed/freellmapi
  description: One OpenAI-compatible endpoint that routes across many free LLM provider tiers, with automatic failover when one runs out.
